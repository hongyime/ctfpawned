name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctfpawned-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run --maxWorkers=1 --no-file-parallelism
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm perf:budget
      - run: pnpm exec playwright test tests/e2e/progress.spec.ts --project=chromium --project=mobile-chrome
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: progress-browser-evidence
          path: test-results/
          retention-days: 3
