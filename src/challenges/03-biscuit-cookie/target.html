<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biscuit: Cookie forging</title>
    <!-- ctfpawned-runtime -->
    <style>
      body {
        background: #fffaf0;
        color: #101010;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      main {
        display: grid;
        gap: 1rem;
        padding: 1rem;
      }

      h1,
      h2,
      p {
        margin-block: 0;
      }

      .grid {
        display: grid;
        gap: 0.75rem;
      }

      .split {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .panel {
        background: #fdf6e3;
        border: 3px solid #101010;
        display: grid;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .controls {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      label {
        display: grid;
        font-weight: 800;
        gap: 0.25rem;
      }

      input,
      select,
      textarea,
      pre,
      output {
        background: #ffffff;
        border: 2px solid #101010;
        color: #101010;
        padding: 0.5rem;
      }

      textarea {
        min-height: 5.5rem;
        resize: vertical;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
      }

      button {
        background: #ffd400;
        border: 2px solid #101010;
        cursor: pointer;
        font-weight: 900;
        padding: 0.5rem 0.75rem;
      }

      button:hover {
        transform: translate(-1px, -1px);
      }

      .flag {
        background: #d9ffe2;
        border: 3px solid #101010;
        display: grid;
        font-weight: 900;
        gap: 0.4rem;
        padding: 0.75rem;
      }

      .muted {
        color: #4f4f4f;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Biscuit treat kiosk</h1>
        <p class="muted">
          The target reads its sandboxed cookie jar before rendering the menu.
        </p>
        <pre id="cookie-view"></pre>
        <div class="controls">
          <button id="refresh" type="button">Refresh menu state</button>
        </div>
      </section>
      <section class="panel" id="volunteer-menu">
        <h2>Volunteer treats</h2>
        <p>Training treats and patient reminders.</p>
      </section>
      <section class="flag" id="staff-menu" hidden>
        <span>Staff treat order panel</span>
        <code id="flag"></code>
      </section>
    </main>
    <script>
      (() => {
        const flag = "ctfpawned{biscuit_staff_treats}";
        const cookieView = document.querySelector("#cookie-view");
        const staffMenu = document.querySelector("#staff-menu");
        const volunteerMenu = document.querySelector("#volunteer-menu");

        document.cookie = "menu=volunteer";

        function renderMenu() {
          cookieView.textContent = document.cookie || "(no cookies)";
          const staff = document.cookie.split("; ").includes("staff=true");
          staffMenu.hidden = !staff;
          volunteerMenu.hidden = staff;
          if (staff) {
            document.querySelector("#flag").textContent = flag;
          }
        }

        document
          .querySelector("#refresh")
          .addEventListener("click", renderMenu);
        renderMenu();
      })();
    </script>
  </body>
</html>
