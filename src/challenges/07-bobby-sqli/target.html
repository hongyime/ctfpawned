<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bobby: SQL injection</title>
    <!-- ctfpawned-runtime -->
    <style>
      body {
        background: #fffaf0;
        color: #101010;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      main {
        display: grid;
        gap: 1rem;
        padding: 1rem;
      }

      h1,
      h2,
      p {
        margin-block: 0;
      }

      .grid {
        display: grid;
        gap: 0.75rem;
      }

      .split {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .panel {
        background: #fdf6e3;
        border: 3px solid #101010;
        display: grid;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .controls {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      label {
        display: grid;
        font-weight: 800;
        gap: 0.25rem;
      }

      input,
      select,
      textarea,
      pre,
      output {
        background: #ffffff;
        border: 2px solid #101010;
        color: #101010;
        padding: 0.5rem;
      }

      textarea {
        min-height: 5.5rem;
        resize: vertical;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
      }

      button {
        background: #ffd400;
        border: 2px solid #101010;
        cursor: pointer;
        font-weight: 900;
        padding: 0.5rem 0.75rem;
      }

      button:hover {
        transform: translate(-1px, -1px);
      }

      .flag {
        background: #d9ffe2;
        border: 3px solid #101010;
        display: grid;
        font-weight: 900;
        gap: 0.4rem;
        padding: 0.75rem;
      }

      .muted {
        color: #4f4f4f;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Bobby adoption search</h1>
        <p class="muted">
          The target prints the query string before running its toy database.
        </p>
        <form id="search-form" class="grid">
          <label
            >Search cats <input id="search" value="smudge" autocomplete="off"
          /></label>
          <button type="submit">Search</button>
        </form>
        <pre id="query"></pre>
      </section>
      <section class="panel">
        <h2>Rows</h2>
        <pre id="rows"></pre>
      </section>
    </main>
    <script>
      (() => {
        const flag = "ctfpawned{bobby_union_staff_note}";
        const cats = [
          { name: "Biscuit", breed: "tabby" },
          { name: "Knox", breed: "tuxedo" },
          { name: "Smudge", breed: "domestic shorthair" },
        ];
        const staffNotes = [
          {
            note: "Staff note",
            detail: "record 1337 urgent queue; flag " + flag,
          },
        ];

        function runToyQuery(term) {
          const query =
            "SELECT name, breed FROM cats WHERE name LIKE '%" +
            term +
            "%' ORDER BY name";
          document.querySelector("#query").textContent = query;
          const lowered = term.toLowerCase();
          if (
            /union\s+select/.test(lowered) &&
            lowered.includes("staff_notes")
          ) {
            return staffNotes.map((row) => ({
              name: row.note,
              breed: row.detail,
            }));
          }
          if (/or\s+['"]?1['"]?\s*=\s*['"]?1/.test(lowered)) {
            return cats;
          }
          return cats.filter((cat) => cat.name.toLowerCase().includes(lowered));
        }

        function renderSearch(event) {
          event?.preventDefault();
          const rows = runToyQuery(document.querySelector("#search").value);
          document.querySelector("#rows").textContent = JSON.stringify(
            rows,
            null,
            2,
          );
        }

        document
          .querySelector("#search-form")
          .addEventListener("submit", renderSearch);
        renderSearch();
      })();
    </script>
  </body>
</html>
