<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dotty: Path traversal</title>
    <!-- ctfpawned-runtime -->
    <style>
      body {
        background: #fffaf0;
        color: #101010;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      main {
        display: grid;
        gap: 1rem;
        padding: 1rem;
      }

      h1,
      h2,
      p {
        margin-block: 0;
      }

      .grid {
        display: grid;
        gap: 0.75rem;
      }

      .split {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .panel {
        background: #fdf6e3;
        border: 3px solid #101010;
        display: grid;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .controls {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      label {
        display: grid;
        font-weight: 800;
        gap: 0.25rem;
      }

      input,
      select,
      textarea,
      pre,
      output {
        background: #ffffff;
        border: 2px solid #101010;
        color: #101010;
        padding: 0.5rem;
      }

      textarea {
        min-height: 5.5rem;
        resize: vertical;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
      }

      button {
        background: #ffd400;
        border: 2px solid #101010;
        cursor: pointer;
        font-weight: 900;
        padding: 0.5rem 0.75rem;
      }

      button:hover {
        transform: translate(-1px, -1px);
      }

      .flag {
        background: #d9ffe2;
        border: 3px solid #101010;
        display: grid;
        font-weight: 900;
        gap: 0.4rem;
        padding: 0.75rem;
      }

      .muted {
        color: #4f4f4f;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Dotty document archive</h1>
        <p class="muted">
          Public documents should stay under <code>public/</code>, but the
          cleanup only removes one pattern.
        </p>
        <div class="controls">
          <label
            >Document name
            <input id="filename" value="welcome.txt" autocomplete="off"
          /></label>
          <button id="open" type="button">Open document</button>
        </div>
        <pre id="path"></pre>
      </section>
      <section class="panel">
        <h2>Document</h2>
        <pre id="document"></pre>
      </section>
    </main>
    <script>
      (() => {
        const flag = "ctfpawned{dotty_private_incident}";
        const files = new Map([
          [
            "public/welcome.txt",
            "Welcome to Nine Lives volunteer orientation.",
          ],
          [
            "public/donations.txt",
            "Donation receipts are processed every Friday.",
          ],
          ["public/adoption-packet.txt", "Public adoption packet checklist."],
          [
            "private/incident.txt",
            "Cage 13 terminal active after closing. Smudge note recovered. Flag: " +
              flag,
          ],
        ]);

        function normalize(filePath) {
          const parts = [];
          for (const part of filePath.split("/")) {
            if (!part || part === ".") continue;
            if (part === "..") parts.pop();
            else parts.push(part);
          }
          return parts.join("/");
        }

        function openDocument() {
          const requested = document.querySelector("#filename").value.trim();
          const cleaned = requested.replace("../", "");
          const finalPath = normalize("public/" + cleaned);
          document.querySelector("#path").textContent =
            "requested: " +
            requested +
            "\ncleaned: " +
            cleaned +
            "\nopened: " +
            finalPath;
          document.querySelector("#document").textContent =
            files.get(finalPath) || "Document not found.";
        }

        document.querySelector("#open").addEventListener("click", openDocument);
        openDocument();
      })();
    </script>
  </body>
</html>
