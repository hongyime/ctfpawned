<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrambles: Encoding mistaken for encryption</title>
    <!-- ctfpawned-runtime -->
    <style>
      body {
        background: #fffaf0;
        color: #101010;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      main {
        display: grid;
        gap: 1rem;
        padding: 1rem;
      }

      h1,
      h2,
      p {
        margin-block: 0;
      }

      .grid {
        display: grid;
        gap: 0.75rem;
      }

      .split {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .panel {
        background: #fdf6e3;
        border: 3px solid #101010;
        display: grid;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .controls {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      label {
        display: grid;
        font-weight: 800;
        gap: 0.25rem;
      }

      input,
      select,
      textarea,
      pre,
      output {
        background: #ffffff;
        border: 2px solid #101010;
        color: #101010;
        padding: 0.5rem;
      }

      textarea {
        min-height: 5.5rem;
        resize: vertical;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
      }

      button {
        background: #ffd400;
        border: 2px solid #101010;
        cursor: pointer;
        font-weight: 900;
        padding: 0.5rem 0.75rem;
      }

      button:hover {
        transform: translate(-1px, -1px);
      }

      .flag {
        background: #d9ffe2;
        border: 3px solid #101010;
        display: grid;
        font-weight: 900;
        gap: 0.4rem;
        padding: 0.75rem;
      }

      .muted {
        color: #4f4f4f;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Scrambles member portal</h1>
        <p class="muted">
          The padlock icon is decorative. The session blob below controls the
          preview.
        </p>
        <label>
          Session blob
          <textarea id="session"></textarea>
        </label>
        <div class="controls">
          <button id="apply" type="button">Refresh session preview</button>
        </div>
      </section>
      <section class="split">
        <div class="panel">
          <h2>Decoded preview</h2>
          <pre id="decoded"></pre>
          <output id="status">waiting</output>
        </div>
        <div class="flag" id="staff-panel" hidden>
          <span>Staff drawer opened</span>
          <code id="flag"></code>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const flag = "ctfpawned{scrambles_staff_drawer}";
        const sessionInput = document.querySelector("#session");
        const decoded = document.querySelector("#decoded");
        const status = document.querySelector("#status");
        const staffPanel = document.querySelector("#staff-panel");
        const flagOutput = document.querySelector("#flag");
        const starterSession = {
          name: "Audit Volunteer",
          role: "volunteer",
          shift: "orientation",
        };

        function encodeSession(value) {
          return btoa(JSON.stringify(value));
        }

        function renderSession() {
          staffPanel.hidden = true;
          try {
            const session = JSON.parse(atob(sessionInput.value.trim()));
            decoded.textContent = JSON.stringify(session, null, 2);
            if (session.role === "staff") {
              status.textContent = "staff session accepted";
              flagOutput.textContent = flag;
              staffPanel.hidden = false;
            } else {
              status.textContent = "volunteer session only";
            }
          } catch (error) {
            decoded.textContent = String(error);
            status.textContent = "session could not be decoded";
          }
        }

        sessionInput.value = encodeSession(starterSession);
        document
          .querySelector("#apply")
          .addEventListener("click", renderSession);
        renderSession();
      })();
    </script>
  </body>
</html>
