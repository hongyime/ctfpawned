<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wildcard: CORS misconfiguration</title>
    <!-- ctfpawned-runtime -->
    <style>
      body {
        background: #fffaf0;
        color: #101010;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      main {
        display: grid;
        gap: 1rem;
        padding: 1rem;
      }

      h1,
      h2,
      p {
        margin-block: 0;
      }

      .grid {
        display: grid;
        gap: 0.75rem;
      }

      .split {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .panel {
        background: #fdf6e3;
        border: 3px solid #101010;
        display: grid;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .controls {
        align-items: end;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      label {
        display: grid;
        font-weight: 800;
        gap: 0.25rem;
      }

      input,
      select,
      textarea,
      pre,
      output {
        background: #ffffff;
        border: 2px solid #101010;
        color: #101010;
        padding: 0.5rem;
      }

      textarea {
        min-height: 5.5rem;
        resize: vertical;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
      }

      button {
        background: #ffd400;
        border: 2px solid #101010;
        cursor: pointer;
        font-weight: 900;
        padding: 0.5rem 0.75rem;
      }

      button:hover {
        transform: translate(-1px, -1px);
      }

      .flag {
        background: #d9ffe2;
        border: 3px solid #101010;
        display: grid;
        font-weight: 900;
        gap: 0.4rem;
        padding: 0.75rem;
      }

      .muted {
        color: #4f4f4f;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="split">
        <div class="panel">
          <h1>Donations API</h1>
          <p class="muted">The donor is signed in inside this simulation.</p>
          <pre id="api-state"></pre>
        </div>
        <div class="panel">
          <h2>Scratch origin</h2>
          <label
            >Origin <input id="origin" value="https://scratch.invalid"
          /></label>
          <label
            >API CORS mode
            <select id="mode">
              <option value="wildcard">Wildcard star</option>
              <option value="allowlist">Partner allowlist</option>
              <option value="reflect">Reflect request origin</option>
            </select>
          </label>
          <label
            ><input id="credentials" type="checkbox" /> Include
            credentials</label
          >
          <button id="request" type="button">Request /api/me</button>
        </div>
      </section>
      <section class="panel">
        <h2>Simulated browser result</h2>
        <pre id="result"></pre>
      </section>
    </main>
    <script>
      (() => {
        const flag = "ctfpawned{wildcard_reflected_origin}";
        const trustedOrigin = "https://partners.ninelives.example";
        document.querySelector("#api-state").textContent = JSON.stringify(
          {
            endpoint: "/api/me",
            signedInDonor: true,
            trustedOrigin,
          },
          null,
          2,
        );

        function apiResponse(request) {
          const mode = document.querySelector("#mode").value;
          const headers = {};
          if (mode === "wildcard") headers["Access-Control-Allow-Origin"] = "*";
          if (mode === "allowlist")
            headers["Access-Control-Allow-Origin"] = trustedOrigin;
          if (mode === "reflect")
            headers["Access-Control-Allow-Origin"] = request.origin;
          if (request.credentials)
            headers["Access-Control-Allow-Credentials"] = "true";
          const body = request.credentials
            ? { donor: "lobby-terminal", recurring: true, flag }
            : { donor: "anonymous", recurring: false };
          return { headers, body };
        }

        function browserCanRead(response, request) {
          const allowedOrigin = response.headers["Access-Control-Allow-Origin"];
          const allowsCredentials =
            response.headers["Access-Control-Allow-Credentials"] === "true";
          if (request.credentials) {
            return allowedOrigin === request.origin && allowsCredentials;
          }
          return allowedOrigin === "*" || allowedOrigin === request.origin;
        }

        function makeRequest() {
          const request = {
            origin: document.querySelector("#origin").value.trim(),
            credentials: document.querySelector("#credentials").checked,
          };
          const response = apiResponse(request);
          const readable = browserCanRead(response, request);
          document.querySelector("#result").textContent = JSON.stringify(
            {
              request,
              responseHeaders: response.headers,
              readable,
              body: readable
                ? response.body
                : "blocked by simulated browser CORS check",
            },
            null,
            2,
          );
        }

        document
          .querySelector("#request")
          .addEventListener("click", makeRequest);
        makeRequest();
      })();
    </script>
  </body>
</html>
